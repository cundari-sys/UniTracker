<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 620" width="300" height="620" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12121c"/><stop offset="1" stop-color="#07070c"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="4" y="4" width="292" height="612" rx="46" fill="url(#bg)" stroke="url(#neon)" stroke-width="3"/>
  <rect x="110" y="16" width="80" height="22" rx="11" fill="#000"/>

  <text x="24" y="78" fill="#fff" font-size="26" font-weight="700">Simulatore</text>
  <text x="24" y="98" fill="#8b8fa3" font-size="12">E se il prossimo voto fosse…</text>

  <circle cx="150" cy="200" r="66" fill="none" stroke="#1d1d2b" stroke-width="14"/>
  <circle cx="150" cy="200" r="66" fill="none" stroke="#FF3B30" stroke-width="14" stroke-linecap="round" stroke-dasharray="415" stroke-dashoffset="250" transform="rotate(-90 150 200)" filter="url(#glow)">
    <animate attributeName="stroke" values="#FF3B30;#FF3B30;#FF9500;#FF9500;#0A84FF;#0A84FF;#30D158;#30D158;#FF3B30" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="250;250;190;190;120;120;40;40;250" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g text-anchor="middle" font-weight="700">
    <text x="150" y="208" font-size="36" fill="#fff">98
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.2;0.2001;0.7;0.75;0.95;0.9501;0.99;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
    <text x="150" y="208" font-size="36" fill="#fff" opacity="0">102
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.25;0.45;0.45;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
    <text x="150" y="208" font-size="36" fill="#fff" opacity="0">106
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5;0.7;0.7;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
    <text x="150" y="208" font-size="36" fill="#39FF14" opacity="0" filter="url(#glow)">110L
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.75;0.95;0.95;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
  </g>
  <text x="150" y="230" fill="#8b8fa3" font-size="11" text-anchor="middle" letter-spacing="1">VOTO PROIETTATO</text>

  <rect x="24" y="310" width="252" height="150" rx="22" fill="#14141f" stroke="#23233a"/>
  <text x="42" y="338" fill="#8b8fa3" font-size="10" letter-spacing="1">VOTO SIMULATO · 12 CFU</text>
  <text x="258" y="340" fill="#fff" font-size="26" font-weight="700" text-anchor="end">
    <tspan>
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.2;0.2001;0.7;0.75;0.95;0.9501;0.99;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
      18
    </tspan>
  </text>
  <text x="258" y="340" fill="#fff" font-size="26" font-weight="700" text-anchor="end" opacity="0">24
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.25;0.45;0.45;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
  </text>
  <text x="258" y="340" fill="#fff" font-size="26" font-weight="700" text-anchor="end" opacity="0">28
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5;0.7;0.7;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
  </text>
  <text x="258" y="340" fill="#39FF14" font-size="26" font-weight="700" text-anchor="end" opacity="0">30L
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.75;0.95;0.95;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
  </text>

  <rect x="42" y="384" width="216" height="8" rx="4" fill="#26263a"/>
  <rect x="42" y="384" width="20" height="8" rx="4" fill="#FF3B30" filter="url(#glow)">
    <animate attributeName="width" values="20;20;80;80;150;150;216;216;20" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#FF3B30;#FF3B30;#FF9500;#FF9500;#0A84FF;#0A84FF;#30D158;#30D158;#FF3B30" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="62" cy="388" r="13" fill="#fff" filter="url(#glow)">
    <animate attributeName="cx" values="62;62;122;122;192;192;258;258;62" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="432" fill="#8b8fa3" font-size="10">18</text>
  <text x="258" y="432" fill="#8b8fa3" font-size="10" text-anchor="end">30L</text>

  <rect x="24" y="480" width="252" height="52" rx="26" fill="url(#neon)" opacity=".9"/>
  <text x="150" y="512" fill="#05050a" font-size="16" font-weight="700" text-anchor="middle">Applica alla simulazione</text>
  <rect x="105" y="598" width="90" height="5" rx="2.5" fill="#fff" opacity=".4"/>
</svg>
