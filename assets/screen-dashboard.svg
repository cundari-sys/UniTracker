<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 620" width="300" height="620" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12121c"/><stop offset="1" stop-color="#07070c"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="4" y="4" width="292" height="612" rx="46" fill="url(#bg)" stroke="url(#neon)" stroke-width="3"/>
  <rect x="110" y="16" width="80" height="22" rx="11" fill="#000"/>

  <text x="24" y="78" fill="#fff" font-size="26" font-weight="700">Dashboard</text>
  <text x="24" y="98" fill="#8b8fa3" font-size="12">Ingegneria Informatica · 2° anno</text>

  <circle cx="150" cy="195" r="62" fill="none" stroke="#1d1d2b" stroke-width="12"/>
  <circle cx="150" cy="195" r="62" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" stroke-dasharray="390" stroke-dashoffset="390" transform="rotate(-90 150 195)" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="390;130;130;390" keyTimes="0;0.4;0.9;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="150" y="203" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">120</text>
  <text x="150" y="224" fill="#8b8fa3" font-size="12" text-anchor="middle">/180 CFU</text>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.3;0.9;1" dur="6s" repeatCount="indefinite"/>
    <rect x="24" y="288" width="122" height="76" rx="18" fill="#14141f" stroke="#23233a"/>
    <text x="38" y="312" fill="#8b8fa3" font-size="9" letter-spacing="1">MEDIA PONDERATA</text>
    <text x="38" y="346" fill="#00F0FF" font-size="30" font-weight="700" filter="url(#glow)">27.4</text>
    <rect x="154" y="288" width="122" height="76" rx="18" fill="#14141f" stroke="#23233a"/>
    <text x="168" y="312" fill="#8b8fa3" font-size="9" letter-spacing="1">VOTO BASE</text>
    <text x="168" y="346" fill="#8B5CF6" font-size="30" font-weight="700" filter="url(#glow)">100.4</text>
    <rect x="24" y="376" width="252" height="76" rx="18" fill="#14141f" stroke="#23233a"/>
    <text x="38" y="400" fill="#8b8fa3" font-size="9" letter-spacing="1">VOTO PROIETTATO</text>
    <text x="38" y="436" fill="#39FF14" font-size="30" font-weight="700" filter="url(#glow)">106 <tspan font-size="14" fill="#8b8fa3">/ 110</tspan></text>
    <rect x="160" y="420" width="100" height="6" rx="3" fill="#1d1d2b"/>
    <rect x="160" y="420" width="96" height="6" rx="3" fill="#39FF14" filter="url(#glow)"/>
  </g>

  <text x="150" y="472" fill="#39FF14" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">
    ● SESSIONE ESTIVA ATTIVA
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </text>
  <rect x="24" y="486" width="252" height="52" rx="26" fill="#0d2a14" stroke="#39FF14" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="150" y="518" fill="#39FF14" font-size="16" font-weight="700" text-anchor="middle">＋  Aggiungi Esame</text>
  <rect x="105" y="598" width="90" height="5" rx="2.5" fill="#fff" opacity=".4"/>
</svg>
