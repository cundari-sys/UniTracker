<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"><animate attributeName="stop-color" values="#00F0FF;#8B5CF6;#00F0FF" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#8B5CF6"><animate attributeName="stop-color" values="#8B5CF6;#00F0FF;#8B5CF6" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a1a2e" stroke-width="1"/>
    </pattern>
    <radialGradient id="orbC"><stop offset="0" stop-color="#00F0FF" stop-opacity=".55"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbV"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".6"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="#05050a"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="220" cy="90" r="220" fill="url(#orbC)">
    <animate attributeName="cx" values="220;420;220" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;230;90" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="240" r="240" fill="url(#orbV)">
    <animate attributeName="cx" values="980;760;980" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="240;80;240" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="168" font-size="104" font-weight="800" fill="url(#neon)" filter="url(#glow)" letter-spacing="-2">UniTrack</text>
    <text x="600" y="218" font-size="22" fill="#9aa0b8" letter-spacing="10">TRACK  ·  SIMULATE  ·  GRADUATE</text>
  </g>
  <rect x="420" y="246" width="360" height="4" rx="2" fill="#1a1a2e"/>
  <rect x="420" y="246" width="90" height="4" rx="2" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="x" values="420;690;420" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="2" y="2" width="1196" height="316" rx="23" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".7"/>
</svg>
