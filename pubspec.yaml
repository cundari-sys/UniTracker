name: unitrack
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  
  shared_preferences: ^2.3.5 # <-- Aggiungi questo

  # Dipendenze UI e Icone
  cupertino_icons: ^1.0.8
  curved_navigation_bar_pro: ^2.2.1

  # Dipendenze Riverpod (State Management & Annotazioni)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generatori di codice (Indispensabili per @riverpod e i file .g.dart)
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

